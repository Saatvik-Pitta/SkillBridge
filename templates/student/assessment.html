<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam: {{ skill.name }} - SkillBridge</title>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3.3 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background-color: #F8FAFC; }
        .exam-shell { max-width: 800px; margin: 2.5rem auto; }
        .option-card:hover { border-color: #3B82F6 !important; background-color: #F0F7FF !important; }
    </style>
</head>
<body>
    <div class="container exam-shell">
        <!-- HEADER: EXAM TITLE, PROGRESS, AND TIMER -->
        <div class="card card-sb p-4 mb-3 border shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <span class="badge bg-primary-subtle text-primary mb-1">Official Skill Verification</span>
                    <h4 class="fw-bold mb-0">{{ skill.name }} Assessment</h4>
                </div>
                <div class="text-end">
                    <div class="text-muted small">Time Remaining</div>
                    <div id="assessTimer" class="fs-4 fw-bold text-primary font-monospace">20:00</div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="d-flex justify-content-between small text-muted mb-1">
                <span id="assessProgressText">Question 1 of {{ questions|length }}</span>
                <span>Randomized Examination</span>
            </div>
            <div class="progress" style="height: 6px;">
                <div id="assessProgressBar" class="progress-bar bg-primary" role="progressbar" style="width: 12%;"></div>
            </div>
        </div>

        <!-- EXAM QUESTION CONTAINER (FOCUSED & DISTRACTION-FREE) -->
        <div class="card card-sb p-4 border shadow-sm mb-3" style="min-height: 380px;">
            <div id="assessQuestionContainer">
                <!-- Dynamically populated by assessment.js -->
            </div>
        </div>

        <!-- NAVIGATION & SUBMISSION BUTTONS -->
        <div class="d-flex justify-content-between align-items-center">
            <button id="btnAssessPrev" class="btn btn-sb-outline" disabled>
                <i class="bi bi-chevron-left me-1"></i> Previous
            </button>
            <div class="d-flex gap-2">
                <button id="btnAssessNext" class="btn btn-sb-primary">
                    Next <i class="bi bi-chevron-right ms-1"></i>
                </button>
                <button id="btnAssessSubmit" class="btn btn-success d-none">
                    <i class="bi bi-check2-circle me-1"></i> Submit Assessment
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Assessment Script -->
    <script src="{{ url_for('static', filename='js/assessment.js') }}"></script>
    <script>
        const questions = {{ questions_json|tojson }};
        const serverEvalData = {{ server_eval_data|tojson }};
        const assessmentId = {{ assessment.id }};
        
        document.addEventListener('DOMContentLoaded', () => {
            new AssessmentRunner(questions, assessmentId, serverEvalData, {{ assessment.time_limit_mins }});
        });
    </script>
</body>
</html>
